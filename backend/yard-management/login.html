<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inloggen | Yard Management</title>
    <style>
        :root {
            --color-primary: #0056b3;
            --color-bg: #f4f7f6;
            --color-text: #212529;
            --color-text-muted: #6c757d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .logo {
            font-size: 2.2rem;
            margin-bottom: .5rem;
        }
        h1 {
            font-size: 1.3rem;
            color: var(--color-primary);
            margin-bottom: .25rem;
        }
        .sub {
            font-size: .85rem;
            color: var(--color-text-muted);
            margin-bottom: 1.75rem;
        }
        label {
            display: block;
            text-align: left;
            font-size: .8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: #555;
            margin-bottom: .4rem;
        }
        input[type="password"] {
            width: 100%;
            padding: .75rem .9rem;
            border: 2px solid #e0e4e3;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1.25rem;
            transition: border-color .2s;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        button {
            width: 100%;
            padding: .8rem;
            background: var(--color-primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
        }
        button:hover { background: #004494; }
        .error {
            background: #fdecea;
            color: #c62828;
            padding: .7rem;
            border-radius: 8px;
            font-size: .85rem;
            margin-bottom: 1rem;
        }
        .back {
            display: inline-block;
            margin-top: 1.25rem;
            font-size: .8rem;
            color: var(--color-text-muted);
            text-decoration: none;
        }
        .back:hover { color: var(--color-primary); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">🚛</div>
        <h1>Yard Management</h1>
        <p class="sub">Balie / expeditie — beveiligde toegang</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="login">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label for="password">Wachtwoord</label>
            <input type="password" id="password" name="password" placeholder="••••••••" autofocus autocomplete="current-password" required>
            <button type="submit">Inloggen</button>
        </form>
        <a class="back" href="/">← Terug naar check-in</a>
    </div>
</body>
</html>
