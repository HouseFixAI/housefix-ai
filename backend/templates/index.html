<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>HouseFix AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #1e293b; padding: 16px 20px; text-align: center; }
    header h1 { font-size: 22px; font-weight: 700; } header h1 span { color: #f59e0b; } header h1 em { font-style: normal; color: #fff; }
    .camera-wrap { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #000; }
    #video { width: 100%; flex: 1; object-fit: cover; display: block; }
    #canvas { display: none; }
    #snapshot { width: 100%; flex: 1; object-fit: contain; display: none; background: #000; }
    .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; pointer-events: none; }
    .overlay > * { pointer-events: auto; }
    .viewfinder { border: 3px dashed rgba(255,255,255,0.5); border-radius: 16px; flex: 1; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
    .viewfinder p { color: rgba(255,255,255,0.6); font-size: 16px; text-align: center; }
    .btn-row { display: flex; gap: 12px; }
    .btn-row button { flex: 1; padding: 16px; border: 2px solid transparent; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .btn-photo { background: #2563eb; color: #fff; }
    .btn-photo:active { background: #1d4ed8; transform: scale(0.97); }
    .btn-photo:disabled { background: #475569; opacity: 0.5; }
    .btn-analyze { background: #f59e0b; color: #1e293b; }
    .btn-analyze:disabled { background: #475569; color: #94a3b8; }
    .btn-retake { background: transparent; color: #94a3b8; border-color: #475569; }
    .btn-retake:active { background: #334155; }
    .results { display: none; padding: 24px; background: #1e293b; }
    .results.active { display: block; }
    .spinner { display: none; width: 48px; height: 48px; border: 4px solid #334155; border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner.active { display: block; }
    .result-item { margin-bottom: 16px; }
    .result-item label { font-size: 12px; color: #94a3b8; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
    .result-item .val { font-size: 18px; color: #fff; font-weight: 600; margin-top: 4px; }
    .result-item .cost { font-size: 28px; color: #f59e0b; font-weight: 900; }
    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .badge-high { background: #05966933; color: #34d399; }
    .badge-medium { background: #d9770633; color: #fbbf24; }
    .badge-low { background: #dc262633; color: #f87171; }
    .error { color: #f87171; text-align: center; padding: 24px; }
    .provider-section { padding: 0 24px 24px; background: #1e293b; }
    .provider-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #fff; }
    .provider-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .provider-card { background: #334155; border-radius: 12px; padding: 14px; }
    .provider-card .cat { font-size: 10px; color: #93c5fd; font-weight: 700; text-transform: uppercase; }
    .provider-card .name { font-size: 14px; font-weight: 600; color: #fff; margin-top: 2px; }
    .provider-card .stars { color: #facc15; font-size: 12px; }
    .provider-card .city { color: #64748b; font-size: 11px; }
    .provider-card .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
    .wa-btn { background: #25D366; color: #fff; padding: 8px; border-radius: 8px; border: none; font-size: 11px; font-weight: 700; text-align: center; text-decoration: none; }
    .quote-btn { background: transparent; border: 1px solid #475569; color: #cbd5e1; padding: 8px; border-radius: 8px; font-size: 11px; font-weight: 700; }
    .reset-btn { background: transparent; border: 1px solid #475569; color: #94a3b8; padding: 8px 16px; border-radius: 10px; font-size: 13px; cursor: pointer; margin-top: 8px; }
    footer { text-align: center; padding: 16px; color: #64748b; font-size: 12px; background: #0f172a; }
    @media (max-width: 480px) { .provider-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <h1><span>HouseFix</span><em> AI</em></h1>
</header>

<div class="camera-wrap" id="cameraWrap">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
  <img id="snapshot" />

  <div class="overlay">
    <div class="viewfinder" id="viewfinder">
      <p id="hintText">📸 Maak een foto van het probleem</p>
    </div>

    <div class="btn-row" id="buttonRow">
      <button class="btn-photo" id="btnPhoto" onclick="takePhoto()">📸 Foto maken</button>
      <button class="btn-analyze" id="btnAnalyze" onclick="analyze()" disabled>🔍 Analyseren</button>
      <button class="btn-retake" id="btnRetake" onclick="resetView()" style="display:none">↩ Opnieuw</button>
    </div>
  </div>
</div>

<div id="loadingIndicator" style="display:none; text-align:center; padding:40px; background:#1e293b;">
  <div class="spinner active"></div>
  <p style="color:#94a3b8;">🛠️ Bezig met analyseren...</p>
</div>

<div class="results" id="results">
  <div id="resultContent"></div>
  <div class="provider-section" id="providerSection" style="display:none; padding:0; margin-top:20px;">
    <h3>🔧 Nabije serviceproviders</h3>
    <div class="filters" id="filters" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;"></div>
    <div class="provider-grid" id="providerGrid"></div>
  </div>
  <button class="reset-btn" onclick="resetAll()" style="display:block; margin:20px auto 0;">↩ Nieuw probleem</button>
</div>

<footer>HouseFix AI — Snel een schatting voor je klus</footer>

<script>
let imageBase64 = null;
let providers = [];
let stream = null;

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    document.getElementById("video").srcObject = stream;
  } catch (e) {
    document.getElementById("hintText").innerHTML = "⚠️ Camera niet beschikbaar. Upload een foto via onderstaande knop.";

    // Fallback: file upload
    const btnRow = document.getElementById("buttonRow");
    btnRow.innerHTML = `
      <input type="file" accept="image/*" capture="environment" id="fileInput" style="display:none" />
      <label for="fileInput" style="flex:1; padding:16px; border:2px solid #2563eb; border-radius:14px; font-size:16px; font-weight:700; background:#2563eb; color:#fff; text-align:center; cursor:pointer;">📁 Kies een foto</label>
      <button class="btn-analyze" id="btnAnalyze" onclick="analyze()" disabled>🔍 Analyseren</button>
    `;
    document.getElementById("fileInput").onchange = handleFileUpload;
  }
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    imageBase64 = ev.target.result.split(",")[1];
    showPreview(ev.target.result);
    document.getElementById("btnAnalyze").disabled = false;
  };
  reader.readAsDataURL(file);
}

function takePhoto() {
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext("2d").drawImage(video, 0, 0);
  imageBase64 = canvas.toDataURL("image/jpeg").split(",")[1];
  showPreview(canvas.toDataURL("image/jpeg"));
  document.getElementById("btnAnalyze").disabled = false;
}

function showPreview(dataUrl) {
  document.getElementById("video").style.display = "none";
  document.getElementById("snapshot").src = dataUrl;
  document.getElementById("snapshot").style.display = "block";
  document.getElementById("viewfinder").style.display = "none";
  document.getElementById("btnPhoto").style.display = "none";
  document.getElementById("btnAnalyze").textContent = "🔍 Analyseren";
  document.getElementById("btnRetake").style.display = "block";
}

async function analyze() {
  if (!imageBase64) return;

  // Show loading
  document.getElementById("cameraWrap").style.display = "none";
  document.getElementById("loadingIndicator").style.display = "block";

  try {
    const resp = await fetch("/api/analyze", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageBase64 })
    });
    const result = await resp.json();

    if (result.error) {
      showError(result.error);
      return;
    }

    // Load providers
    const provResp = await fetch("/api/providers");
    providers = await provResp.json();

    showResults(result);

  } catch (e) {
    showError("Er ging iets mis. Probeer opnieuw.");
  }

  document.getElementById("loadingIndicator").style.display = "none";
  document.getElementById("results").classList.add("active");
}

function showResults(analysis) {
  const container = document.getElementById("resultContent");

  const confClass = analysis.confidence === 'high' ? 'badge-high' : analysis.confidence === 'medium' ? 'badge-medium' : 'badge-low';
  const confLabel = analysis.confidence === 'high' ? 'Hoog' : analysis.confidence === 'medium' ? 'Gemiddeld' : 'Laag';

  container.innerHTML = `
    <div class="result-item">
      <label>Probleem</label>
      <div class="val" style="text-transform:capitalize">${analysis.issue_type}</div>
    </div>
    <div class="result-item">
      <label>Beschrijving</label>
      <div class="val" style="font-weight:400; color:#cbd5e1;">${analysis.description}</div>
    </div>
    <div class="result-item">
      <label>Geschatte kosten</label>
      <div class="cost">${analysis.cost_range}</div>
    </div>
    <div class="result-item">
      <span class="badge ${confClass}">${confLabel} vertrouwen</span>
    </div>
  `;

  // Show providers
  const provSection = document.getElementById("providerSection");
  const filterDiv = document.getElementById("filters");
  const grid = document.getElementById("providerGrid");
  provSection.style.display = "block";

  const categories = ['Alles', ...new Set(providers.map(p => p.category))];
  filterDiv.innerHTML = categories.map(cat =>
    `<button class="filter-btn" data-cat="${cat}" onclick="filterProviders('${cat}')" style="padding:6px 14px; border-radius:999px; font-size:12px; font-weight:600; border:none; cursor:pointer; ${cat === 'Alles' ? 'background:#2563eb; color:#fff;' : 'background:#334155; color:#94a3b8;'}">${cat}</button>`
  ).join("");

  renderProviders(providers);
}

function renderProviders(list) {
  const grid = document.getElementById("providerGrid");
  grid.innerHTML = list.map(p => `
    <div class="provider-card">
      <div class="cat">${p.category}</div>
      <div class="name">${p.name}</div>
      <div><span class="stars">${'★'.repeat(Math.floor(p.rating))}${p.rating % 1 >= 0.5 ? '½' : ''}</span> <span class="city">${p.city}</span></div>
      <div class="actions">
        <a class="wa-btn" href="https://wa.me/${p.phone}?text=Hallo ${p.name}, ik heb een klus via HouseFix AI en wil graag meer informatie." target="_blank">💬 WhatsApp</a>
        <button class="quote-btn" onclick="alert('Offerte aanvragen komt binnenkort!')">📋 Offertes</button>
      </div>
    </div>
  `).join("");
}

function filterProviders(cat) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.style.background = b.dataset.cat === cat ? '#2563eb' : '#334155';
    b.style.color = b.dataset.cat === cat ? '#fff' : '#94a3b8';
  });
  if (cat === 'Alles') renderProviders(providers);
  else renderProviders(providers.filter(p => p.category === cat));
}

function showError(msg) {
  document.getElementById("resultContent").innerHTML = `<div class="error">⚠️ ${msg}</div>`;
  document.getElementById("providerSection").style.display = "none";
}

function resetView() {
  imageBase64 = null;
  document.getElementById("video").style.display = "block";
  document.getElementById("snapshot").style.display = "none";
  document.getElementById("viewfinder").style.display = "flex";
  document.getElementById("btnPhoto").style.display = "block";
  document.getElementById("btnRetake").style.display = "none";
  document.getElementById("btnAnalyze").textContent = "🔍 Analyseren";
  document.getElementById("btnAnalyze").disabled = true;
}

function resetAll() {
  resetView();
  document.getElementById("cameraWrap").style.display = "flex";
  document.getElementById("results").classList.remove("active");
}

startCamera();
</script>
</body>
</html>
